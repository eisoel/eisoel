<title>해양수산부 부산지방해양수산청</title>
<desc>대한민국 정부상징 — 본부 병기형 국문 가로조합 A type (2행). 두 줄 사이에 정부회색 구분선(요청에 따른 가이드 외 요소). 캔버스는 보호공간(좌우 8r, 상하 5r)을 포함.</desc>
